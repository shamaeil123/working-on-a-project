<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Details | Rose & Pearl</title>

    <link rel="stylesheet" href="product.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">Rose & Pearl</div>

      <nav>
        <a href="project.html"> Home </a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="product.html" class="nav-link">product</a>
        <a href="login.html" class="nav-link active">Login</a>
        <a href="register.html" class="nav-link">Register</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="nav-icons">
        <a href="#" class="icon"> ♡ </a>

        <a href="#" class="icon"> 🛒 </a>

        <a href="#" class="login"> Login </a>
      </div>
    </header>

    <!-- PRODUCT DETAILS -->

    <main class="details-page">
      <div class="details-image">
        <img
          src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=80"
          alt="Pink Handbag"
        />
      </div>

      <div class="details-info">
        <small> Bags </small>

        <h1>Pink Handbag</h1>

        <div class="rating">★★★★★</div>

        <h2>RM 89</h2>

        <p>
          A beautiful and elegant handbag designed for everyday fashion. Perfect
          for casual and special occasions.
        </p>

        <!-- COLOR -->

        <div class="option">
          <label> Color: </label>

          <div class="color-options">
            <button class="color pink"></button>

            <button class="color black"></button>

            <button class="color white"></button>
          </div>
        </div>

        <!-- SIZE -->

        <div class="option">
          <label> Size: </label>

          <div class="size-options">
            <button>Small</button>

            <button>Medium</button>

            <button>Large</button>
          </div>
        </div>

        <!-- QUANTITY -->

        <div class="quantity">
          <label> Quantity: </label>

          <input type="number" value="1" min="1" />
        </div>

        <!-- ADD CART -->

        <a href="#" class="add-cart"> Add to Cart 🛒 </a>

        <a href="#" class="wishlist-large"> ♡ Add to Wishlist </a>
      </div>
    </main>

    <footer>
      <p>© 2026 Rose & Pearl. All Rights Reserved.</p>
    </footer>
  </body>
</html>
